name: Build Portable (Win/Mac/Linux)

# ============================================
#  触发条件：
#    1. push 到 main / master 分支 → 自动构建（无签名）
#    2. workflow_dispatch 手动触发 → 可选是否签名
#    3. tag 触发（v*）→ release.yml 接管，发带签名的 Release
#
#  签名逻辑：
#    - 检测到对应 secrets 才走签名
#    - 没配 secrets → 跳过签名步骤，打印"未签名"提示
#    - 签名失败 → 整个 build 失败（不会产出"半签名"产物）
# ============================================

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      sign:
        description: '强制要求签名（否则失败）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# ============================================
#  取消旧 build（同一 PR/push）
# ============================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================
#  任务矩阵：4 平台并行
# ============================================
jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows 11 x64 ----
          - os: windows-latest
            label: windows-x64
            arch: x64
            artifact: LawExec-OCR-windows-x64
            script_ps: build/build_windows.ps1
            needs_sign: ${{ github.event_name == 'workflow_dispatch' && inputs.sign }}
            sign_artifact: '_platform/windows-x64/LawExec-OCR.exe'
            sign_artifact_dir: '_platform/windows-x64'
          # ---- macOS ARM64 (M1+) ----
          - os: macos-latest
            label: macos-arm64
            arch: arm64
            artifact: LawExec-OCR-macos-arm64
            script_sh: build/build_macos.sh
            needs_sign: ${{ github.event_name == 'workflow_dispatch' && inputs.sign }}
            sign_artifact: '_platform/macos-arm64/LawExec-OCR'
            sign_artifact_dir: '_platform/macos-arm64'
            notarize: true
          # ---- macOS Intel x64 ----
          - os: macos-13
            label: macos-x64
            arch: x64
            artifact: LawExec-OCR-macos-x64
            script_sh: build/build_macos.sh
            needs_sign: ${{ github.event_name == 'workflow_dispatch' && inputs.sign }}
            sign_artifact: '_platform/macos-x64/LawExec-OCR'
            sign_artifact_dir: '_platform/macos-x64'
            notarize: true
          # ---- Linux x64 ----
          - os: ubuntu-latest
            label: linux-x64
            arch: x64
            artifact: LawExec-OCR-linux-x64
            script_sh: build/build_linux.sh
            needs_sign: false
            sign_artifact: '_platform/linux-x64/LawExec-OCR'
            sign_artifact_dir: '_platform/linux-x64'

    steps:
      # ---- 1. 检出代码 ----
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ---- 2. UTF-8 环境 ----
      - name: 🌐 UTF-8 locale
        shell: bash
        run: |
          echo "LANG=C.UTF-8" >> $GITHUB_ENV
          echo "LC_ALL=C.UTF-8" >> $GITHUB_ENV
          echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV

      # ---- 3. Python + 缓存 ----
      - name: 🐍 Setup Python 3.11 (with cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            _app/requirements-portable.txt
            build/*.ps1
            build/*.sh

      # ---- 4. 跑构建 ----
      - name: 🔨 Build ${{ matrix.label }}
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            pwsh -ExecutionPolicy Bypass -File ${{ matrix.script_ps }}
          else
            chmod +x ${{ matrix.script_sh }}
            if [[ "${{ matrix.label }}" == macos-* ]]; then
              ./${{ matrix.script_sh }} ${{ matrix.arch }}
            else
              ./${{ matrix.script_sh }}
            fi
          fi

      # ---- 5. 验证产物 ----
      - name: ✅ Verify artifact
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            test -f "_platform/windows-x64/LawExec-OCR.exe" || (echo "❌ EXE 缺失" && exit 1)
            du -sh _platform/windows-x64/
          else
            test -f "${{ matrix.sign_artifact }}" || (echo "❌ 二进制缺失" && exit 1)
            file ${{ matrix.sign_artifact }} || true
            du -sh ${{ matrix.sign_artifact_dir }}/
          fi

      # ---- 6. macOS 代码签名 + 公证 ----
      - name: 🍎 Sign & Notarize (macOS)
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-13'
        env:
          NEEDS_SIGN: ${{ matrix.needs_sign }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # 1. 检查 secrets 是否齐全
          if [[ -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" \
                || -z "$APPLE_TEAM_ID" || -z "$MACOS_CERT_P12" \
                || -z "$MACOS_CERT_PASSWORD" ]]; then
            if [[ "$NEEDS_SIGN" == "true" ]]; then
              echo "❌ 需要签名但 Apple 签名 secrets 未配置"
              echo "   请按 .github/SECRETS.md 配置以下 5 项："
              echo "   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID,"
              echo "   MACOS_CERT_P12, MACOS_CERT_PASSWORD"
              exit 1
            else
              echo "⚠️  Apple 签名 secrets 未配置，跳过签名（产物为未签名状态）"
              echo "   macOS 用户首次启动需运行 _INSTALL_FIRST_TIME.command"
              exit 0
            fi
          fi

          echo "🍎 开始 macOS 签名 + 公证..."
          # 2. 导入 Developer ID 证书到 keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 3. 解码 base64 证书并导入
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
              -P "$MACOS_CERT_PASSWORD" \
              -A -t cert -f pkcs12 \
              -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s "$KEYCHAIN_PATH"

          # 4. 给二进制签名（ad-hoc 给单文件；--deep 给 .app）
          echo "   签名 ${{ matrix.sign_artifact }}"
          codesign --force --deep --options runtime \
              --sign "Developer ID Application: $APPLE_TEAM_ID" \
              --timestamp \
              "${{ matrix.sign_artifact }}"
          codesign --verify --verbose=2 "${{ matrix.sign_artifact }}"

          # 5. 打包成 .app（公证需要 .app 或 .dmg，不能是裸二进制）
          APP_NAME="LawExec-OCR.app"
          APP_DIR="$RUNNER_TEMP/$APP_NAME"
          mkdir -p "$APP_DIR/Contents/MacOS"
          mkdir -p "$APP_DIR/Contents/Resources"
          cp -R ${{ matrix.sign_artifact_dir }}/_internal "$APP_DIR/Contents/Resources/"
          cp ${{ matrix.sign_artifact}} "$APP_DIR/Contents/MacOS/LawExec-OCR"

          cat > "$APP_DIR/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>LawExec OCR</string>
              <key>CFBundleDisplayName</key><string>LawExec OCR</string>
              <key>CFBundleIdentifier</key><string>com.talomei.lawexec-ocr</string>
              <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
              <key>CFBundleShortVersionString</key><string>3.0.0</string>
              <key>CFBundleExecutable</key><string>LawExec-OCR</string>
              <key>LSMinimumSystemVersion</key><string>11.0</string>
              <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # 6. 重新签名 .app（含 Info.plist）
          codesign --force --deep --options runtime \
              --sign "Developer ID Application: $APPLE_TEAM_ID" \
              --timestamp \
              "$APP_DIR"

          # 7. 打包成 zip 准备公证
          ZIP_PATH="$RUNNER_TEMP/$APP_NAME.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$ZIP_PATH"

          # 8. 提交公证（用 notarytool）
          echo "   提交公证..."
          xcrun notarytool submit "$ZIP_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait

          # 9. 装订公证票据
          xcrun stapler staple "$APP_DIR"
          xcrun stapler validate "$APP_DIR"

          # 10. 用签好公证的 .app 替换原产物
          rm -rf ${{ matrix.sign_artifact_dir }}
          mkdir -p ${{ matrix.sign_artifact_dir }}
          cp -R "$APP_DIR" ${{ matrix.sign_artifact_dir }}/
          echo "✅ macOS 签名 + 公证完成"

      # ---- 7. Windows 代码签名 ----
      - name: 🪟 Sign (Windows)
        if: matrix.os == 'windows-latest'
        env:
          NEEDS_SIGN: ${{ matrix.needs_sign }}
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERT_PFX) -or [string]::IsNullOrEmpty($env:WINDOWS_CERT_PASSWORD)) {
            if ($env:NEEDS_SIGN -eq "true") {
              Write-Host "❌ 需要签名但 Windows 签名 secrets 未配置" -ForegroundColor Red
              Write-Host "   请按 .github/SECRETS.md 配置 WINDOWS_CERT_PFX + WINDOWS_CERT_PASSWORD"
              exit 1
            } else {
              Write-Host "⚠️  Windows 签名 secrets 未配置，跳过签名（产物为未签名状态）" -ForegroundColor Yellow
              Write-Host "   Windows 用户首次启动需点'更多信息 → 仍要运行'"
              exit 0
            }
          }

          Write-Host "🪟 开始 Windows 代码签名..."
          # 1. 解码 base64 证书
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX)
          $certPath = "$env:RUNNER_TEMP\code_sign.pfx"
          [IO.File]::WriteAllBytes($certPath, $bytes)

          # 2. 优先用 signtool（VS Build Tools 提供）
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
              # GitHub-hosted windows-latest 通常有 Windows SDK
              $signtool = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          }
          if (-not (Test-Path $signtool)) {
              Write-Host "❌ 找不到 signtool.exe" -ForegroundColor Red
              Write-Host "   可用选项："
              Write-Host "   1. 安装 Windows SDK（推荐）"
              Write-Host "   2. 改用 Azure Trusted Signing（无需本地证书）"
              exit 1
          }

          # 3. 签名（带时间戳 + RFC3161）
          $timestampUrl = "http://timestamp.digicert.com"
          & $signtool sign /f $certPath /p "$env:WINDOWS_CERT_PASSWORD" /tr $timestampUrl /td sha256 /fd sha256 /v "${{ matrix.sign_artifact }}"

          # 4. 验证
          & $signtool verify /pa "${{ matrix.sign_artifact }}"
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ 签名验证失败" -ForegroundColor Red
              exit 1
          }
          Write-Host "✅ Windows 签名完成"

      # ---- 8. 冒烟测试（仅 Linux）----
      - name: 🧪 Smoke test (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd _platform/linux-x64
          timeout 8 ./LawExec-OCR > /tmp/smoke.log 2>&1 &
          PID=$!
          sleep 5
          if curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8501/ | grep -q 200; then
            echo "✅ HTTP 200 - 服务正常"
          else
            echo "❌ HTTP 失败"; cat /tmp/smoke.log; exit 1
          fi
          kill $PID 2>/dev/null || true
          pkill -9 -f LawExec-OCR 2>/dev/null || true

      # ---- 9. 打包成 zip ----
      - name: 📦 Zip artifact
        shell: bash
        run: |
          cd _platform
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows: 7z 优先，回退 PowerShell Compress-Archive
            if command -v 7z >/dev/null 2>&1; then
              7z a ../${{ matrix.artifact }}.zip ${{ matrix.label }}/
            else
              powershell -Command "Compress-Archive -Path '${{ matrix.label }}' -DestinationPath '../${{ matrix.artifact }}.zip' -Force"
            fi
          else
            zip -qr ../${{ matrix.artifact }}.zip ${{ matrix.label }}/
          fi
          ls -lh ../${{ matrix.artifact }}.zip

      # ---- 10. 上传 artifact（仅手动触发时）----
      - name: 📤 Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 14

      # ---- 11. tag 触发时把 zip 暂存给 release job ----
      - name: 📤 Stage for release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 90

  # ============================================
  #  📦 Release job（只在 tag 触发时跑）
  #  依赖：4 个 build job 全部 success
  #  功能：拉 4 个 zip → 发 GitHub Release
  # ============================================
  release:
    name: 📦 Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]            # 等所有 build job 完成
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: LawExec-OCR-*
          merge-multiple: false

      - name: 📋 List artifacts
        run: |
          echo "=== 下载到的产物 ==="
          ls -lhR dist/
          echo ""
          echo "=== 计算总大小 ==="
          du -sh dist/

      - name: 🔐 Generate SHA256 checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt 2>/dev/null || \
            find . -name "*.zip" -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/**/*.zip
            dist/SHA256SUMS.txt
          body: |
            ## ⚖️ LawExec OCR v${{ github.ref_name }} - 便携版

            ### 📥 下载对应你系统的版本

            | 平台 | 文件 | 大小 |
            |------|------|------|
            | 🪟 Windows 11 x64 | `LawExec-OCR-windows-x64.zip` | 见 Assets |
            | 🍎 macOS M1+ (ARM64) | `LawExec-OCR-macos-arm64.zip` | 见 Assets |
            | 🍎 macOS Intel (x64) | `LawExec-OCR-macos-x64.zip` | 见 Assets |
            | 🐧 Linux x64 | `LawExec-OCR-linux-x64.zip` | 见 Assets |

            ### 🔐 校验完整性

            ```bash
            # 下载 SHA256SUMS.txt 校验
            sha256sum -c SHA256SUMS.txt
            ```

            ### 🚀 使用方法

            - **Windows**: 解压 → 双击 `start.bat`
            - **macOS**: 解压 → 首次双击 `_INSTALL_FIRST_TIME.command` → 双击 `start.command`
            - **Linux**: 解压 → 终端运行 `./start.sh`

            ---

            **⚠️ macOS / Windows 签名状态**：如 Release 说明带 "Signed" 标签，说明经过 Apple 公证 / Windows EV 签名，可直接双击运行；否则首次需用户授权。

      - name: ✅ Release complete
        if: success()
        run: |
          echo "🎉 Release ${{ github.ref_name }} 已发布"
          echo "   访问：${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
