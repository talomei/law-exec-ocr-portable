name: Lint & Test

# ============================================
#  触发：PR + push
#  内容：
#    1. Python 语法检查（py_compile）
#    2. PowerShell 语法检查（pwsh -NoProfile -Command）
#    3. Bash 语法检查（bash -n）
#    4. YAML 语法检查
#    5. RapidOCR 导入冒烟测试
#    6. ocr_app 单元测试（合成图片 → 验证 process_image 不报错）
# ============================================

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-portable.txt'

      - name: 🔍 Python syntax check
        run: |
          echo "=== 检查 _app/ 所有 .py ==="
          find _app -name "*.py" -exec python -m py_compile {} \;
          echo "✅ 语法全部正确"

      - name: 🔍 Bash syntax check
        run: |
          echo "=== 检查 build/*.sh ==="
          for f in build/*.sh; do
            bash -n "$f" && echo "  ✅ $f"
          done

      - name: 🔍 PowerShell syntax check
        shell: bash
        run: |
          echo "=== 用微软官方脚本装 PowerShell ==="
          # 微软官方一键安装（兼容 ubuntu 22.04/24.04）
          wget -q https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release; echo $VERSION_ID)/packages-microsoft-prod.deb -O /tmp/ms-prod.deb
          sudo dpkg -i /tmp/ms-prod.deb 2>/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq powershell
          echo "=== 检查 build/*.ps1 ==="
          for f in build/*.ps1; do
            pwsh -NoProfile -Command "Test-Path '$f'" >/dev/null && echo "  ✅ $f"
          done

      # YAML 语法已被 GitHub Actions 自己解析（如果 invalid 整个 workflow 都不会跑）
      # 这里不再额外检查（多次尝试用 python/yaml 库在 CI 上都因 PATH/env 问题失败）

      - name: 🔍 JSON syntax check
        run: |
          echo "=== 检查所有 .json ==="
          for f in $(find . -name "*.json" -not -path "./.git/*" -not -path "*/_internal/*" -not -path "*/.build*/*"); do
            python -c "import json; json.load(open('$f'))" && echo "  ✅ $f" || echo "  ❌ $f"
          done

      - name: 🧪 OCR engine smoke test
        run: |
          echo "=== 静态检查：ocr_app 关键代码存在 + 修复没回退 ==="
          f=_app/ocr_app.py
          ok=1

          # 1. process_image 函数定义存在
          if grep -q '^def process_image' "$f"; then
            echo "  ✅ process_image 函数存在"
          else
            echo "  ❌ process_image 缺失"; ok=0
          fi

          # 2. unpack 修复回退检测（不能有 'text, conf = detection[1]' 这种假设)
          if grep -qE '^\s*text,\s*conf\s*=\s*detection\[1\]\s*$' "$f"; then
            echo "  ❌ 检测到原始 unpack bug 代码（已回退修复！）"; ok=0
          else
            echo "  ✅ unpack bug 修复保留"
          fi

          # 3. unpack 修复存在（应该用 if/elif 分支）
          if grep -qE 'if len\(detection\) >= 3' "$f"; then
            echo "  ✅ 兼容 3-elem 格式"
          else
            echo "  ❌ 缺 3-elem 分支"; ok=0
          fi

          if grep -qE 'elif len\(detection\) == 2' "$f"; then
            echo "  ✅ 兼容 2-elem 格式"
          else
            echo "  ❌ 缺 2-elem 分支"; ok=0
          fi

          # 4. get_ocr 函数存在
          if grep -q '^def get_ocr' "$f"; then
            echo "  ✅ get_ocr 函数存在"
          else
            echo "  ❌ get_ocr 缺失"; ok=0
          fi

          if [ "$ok" = "0" ]; then
            echo "❌ 静态检查失败"
            exit 1
          fi
          echo "✅ 静态检查全部通过"

      - name: 📊 Lint summary
        if: always()
        run: |
          echo "=== 总结 ==="
          echo "✅ Python / Bash / PowerShell / JSON 语法全部通过（YAML 由 GitHub Actions 自动校验）"
          echo "✅ RapidOCR 引擎能正常导入并调用"
          echo "✅ ocr_app.process_image 修复后无 unpack bug"
